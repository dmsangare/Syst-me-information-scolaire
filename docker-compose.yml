version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: sis-mali-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sis_mali}
      POSTGRES_USER: ${POSTGRES_USER:-sis_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SisMali_Dev_2026!Secure}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sis_user} -d ${POSTGRES_DB:-sis_mali}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sis-net

  redis:
    image: redis:7-alpine
    container_name: sis-mali-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - sis-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: sis-mali-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql://sis_user:SisMali_Dev_2026!Secure@postgres:5432/sis_mali?schema=public}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      PORT: 3000
      TZ: Africa/Bamako
    volumes:
      - ./storage:/app/storage
    ports:
      - "3000:3000"
    networks:
      - sis-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3000/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: sis-mali-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql://sis_user:SisMali_Dev_2026!Secure@postgres:5432/sis_mali?schema=public}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      TZ: Africa/Bamako
    volumes:
      - ./storage:/app/storage
    networks:
      - sis-net

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: /api/v1
    container_name: sis-mali-web
    restart: unless-stopped
    networks:
      - sis-net

  nginx:
    image: nginx:1.25-alpine
    container_name: sis-mali-nginx
    restart: unless-stopped
    depends_on:
      - api
      - web
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
      - ./storage/documents:/var/www/documents:ro
    networks:
      - sis-net

volumes:
  pgdata:
  redisdata:

networks:
  sis-net: